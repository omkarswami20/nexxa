spring.application.name=Nexashop

# Database Configuration
# WARNING: Default password below is for local development only. Set DB_PASSWORD environment variable for production!
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexashop?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:newpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# Email Configuration
# WARNING: Default values below are for local development only. Set MAIL_USERNAME and MAIL_PASSWORD environment variables for production!
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:otxnexa1@gmail.com}
spring.mail.password=${MAIL_PASSWORD:arxiewcopocejaqs}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true




# Frontend Configuration
app.frontend.url=http://localhost:5173

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# SMS API Configuration
app.sms.api.key=${SMS_API_KEY:}
